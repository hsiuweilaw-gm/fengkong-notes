<html lang="zh-Hant-TW">
<head>

<title>風控筆記 全集</title>

<style>
/* 版面概念：一本按月分冊的判決卷宗目錄。左欄是卷號與日期，右欄是圖卡與重點；朱紅只用在卷號與目前的篩選。 */
:root {
  --paper: #EEE7D7;
  --sheet: #F6F1E6;
  --ink: #1C1A15;
  --muted: #6A6357;
  --rule: #D3C8B2;
  --dot: rgba(120, 100, 70, .16);
  --accent: #B2392D;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171510; --sheet: #1F1C16; --ink: #ECE4D2; --muted: #A69E8D; --rule: #3A352B; --accent: #DA6352; --dot: rgba(236, 228, 210, .07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171510; --sheet: #1F1C16; --ink: #ECE4D2; --muted: #A69E8D; --rule: #3A352B; --accent: #DA6352; --dot: rgba(236, 228, 210, .07);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; color: var(--ink); font-family: var(--serif); line-height: 1.75; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 0 72px; }
body::before { content: ""; position: fixed; inset: 0 auto 0 0; width: 10px; background: var(--accent); z-index: 6; }

/* 刊頭 */
.masthead { padding-block: 56px 28px; border-bottom: 1px solid var(--ink); display: grid; gap: 20px; }
.id { display: flex; align-items: center; gap: 16px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid var(--sheet); outline: 1px solid var(--rule); flex: none; background: var(--sheet); }
.brand { font-family: var(--sans); font-weight: 500; font-size: 13px; letter-spacing: .32em; color: var(--muted); margin: 0; }
.who { font-family: var(--sans); font-weight: 300; font-size: 15px; color: var(--ink); letter-spacing: .12em; margin: 4px 0 0; }
.headline { font-family: var(--sans); font-weight: 300; font-size: clamp(30px, 5.6vw, 54px); line-height: 1.25; letter-spacing: .08em; margin: 0; text-wrap: balance; }
.headline em { font-style: normal; color: var(--accent); }
.ledger { display: flex; flex-wrap: wrap; gap: 10px 32px; font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
.ledger b { color: var(--ink); font-weight: 500; font-size: 15px; margin-left: 6px; }

/* 篩選列 */
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); box-shadow: 0 -12px 0 var(--paper); padding-block: 14px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--sans); font-size: 14px; border: 1px solid var(--rule); background: transparent; color: var(--ink); padding: 5px 12px; border-radius: 2px; cursor: pointer; }
.chip span { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] span { color: var(--accent); }
.chip:focus-visible, .search:focus-visible, .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { font-family: var(--sans); font-size: 15px; width: min(100%, 300px); padding: 7px 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 2px; }

/* 月份分冊 */
.month { margin-top: 44px; }
.month h2 { font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .14em; color: var(--muted); margin: 0 0 4px; display: flex; gap: 12px; align-items: baseline; }
.month h2 strong { font-family: var(--sans); font-weight: 300; font-size: 26px; letter-spacing: .06em; color: var(--ink); }

/* 單集 */
.ep { display: grid; grid-template-columns: 88px 150px minmax(0, 1fr); gap: 22px; padding-block: 26px; border-top: 1px solid var(--rule); }
.meta { font-family: var(--mono); font-variant-numeric: tabular-nums; display: grid; align-content: start; gap: 2px; }
.no { color: var(--accent); font-size: 22px; font-weight: 500; letter-spacing: .02em; }
.date { font-size: 12px; color: var(--muted); }
.line { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-top: 8px; }
.thumb { width: 150px; aspect-ratio: 4 / 5; max-width: 100%; background: var(--sheet); border: 1px solid var(--rule); overflow: hidden; display: block; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.empty { display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.body { min-width: 0; display: grid; gap: 10px; align-content: start; }
.title { font-size: 22px; font-weight: 700; line-height: 1.45; margin: 0; text-wrap: balance; }
.kw { font-family: var(--sans); font-weight: 300; font-size: 13px; color: var(--muted); margin: -6px 0 0; letter-spacing: .04em; }
.hook { margin: 0; font-size: 16px; padding-left: 14px; border-left: 2px solid var(--rule); }
.take { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
.take li { display: grid; grid-template-columns: 22px minmax(0, 1fr); }
.take li::before { content: attr(data-n); font-family: var(--mono); font-size: 12px; color: var(--accent); padding-top: 3px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; margin-top: 4px; }
.case { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--sans); font-size: 14px; }
.links a { text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
.links a:hover { border-color: var(--accent); color: var(--accent); }
.none { padding-block: 40px; color: var(--muted); font-family: var(--sans); }

.colophon { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--ink); font-family: var(--sans); font-size: 13px; color: var(--muted); display: grid; gap: 6px; }

@media (max-width: 720px) {
  .ep { grid-template-columns: 96px minmax(0, 1fr); gap: 14px 16px; }
  .meta { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; gap: 12px; align-items: baseline; }
  .line { margin-top: 0; }
  .thumb { width: 96px; }
  .title { font-size: 19px; }
}
@media (max-width: 440px) {
  .ep { grid-template-columns: minmax(0, 1fr); }
  .thumb { width: 120px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ep { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
</head>

<script>
(function () {
  var raw = document.getElementById("data").textContent;
  var data;
  try { data = JSON.parse(raw); } catch (e) { data = { episodes: [], count: 0, updated: "" }; }
  var eps = data.episodes || [];
  var LINES = ["全部", "保險理賠", "家長與孩子", "職場", "生活與程序"];
  var WEEK = "日一二三四五六";
  var state = { line: "全部", q: "" };

  function esc(s) { return String(s || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return String(n).padStart(3, "0"); }
  function fmtDate(d) { var p = d.split("-"); var dt = new Date(+p[0], +p[1] - 1, +p[2]); return p[1] + "/" + p[2] + "（" + WEEK[dt.getDay()] + "）"; }

  document.getElementById("count").textContent = eps.length;
  if (eps.length) {
    var dates = eps.map(function (e) { return e.date; }).sort();
    document.getElementById("first").textContent = dates[0].replace(/-/g, ".");
    document.getElementById("updated").textContent = (data.updated || dates[dates.length - 1]).replace(/-/g, ".");
  }

  var chips = document.getElementById("chips");
  LINES.forEach(function (name) {
    var n = name === "全部" ? eps.length : eps.filter(function (e) { return e.line === name; }).length;
    if (!n && name !== "全部") return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.line = name;
    b.setAttribute("aria-pressed", name === state.line ? "true" : "false");
    b.innerHTML = esc(name) + "<span>" + n + "</span>";
    b.addEventListener("click", function () { state.line = name; sync(); render(); });
    chips.appendChild(b);
  });
  function sync() { chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.line === state.line ? "true" : "false"); }); }

  var q = document.getElementById("q");
  q.addEventListener("input", function () { state.q = q.value.trim(); render(); });

  function match(e) {
    if (state.line !== "全部" && e.line !== state.line) return false;
    if (!state.q) return true;
    var hay = [e.title, e.keywords, e.hook, e.case, (e.takeaways || []).join(" "), "NO." + pad(e.no), String(e.no)].join(" ");
    return state.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function item(e) {
    var thumb = e.img
      ? '<a class="thumb" href="' + esc(e.fb || e.ig || e.img) + '" target="_blank" rel="noopener"><img src="' + esc(e.img) + '" alt="NO.' + pad(e.no) + ' 圖卡" loading="lazy" width="150" height="188"></a>'
      : '<div class="thumb empty">NO.' + pad(e.no) + '</div>';
    var take = (e.takeaways || []).length
      ? '<ol class="take">' + e.takeaways.map(function (t, i) { return '<li data-n="0' + (i + 1) + '">' + esc(t) + "</li>"; }).join("") + "</ol>"
      : "";
    var links = [];
    if (e.judgment_url) links.push('<a href="' + esc(e.judgment_url) + '" target="_blank" rel="noopener">判決全文 ↗</a>');
    if (e.fb) links.push('<a href="' + esc(e.fb) + '" target="_blank" rel="noopener">Facebook ↗</a>');
    if (e.ig) links.push('<a href="' + esc(e.ig) + '" target="_blank" rel="noopener">Instagram ↗</a>');
    return '<article class="ep" id="no' + e.no + '">' +
      '<div class="meta"><span class="no">' + pad(e.no) + '</span><span class="date">' + esc(fmtDate(e.date)) + '</span><span class="line">' + esc(e.line) + "</span></div>" +
      thumb +
      '<div class="body"><h3 class="title">' + esc(e.title) + "</h3>" +
      (e.keywords ? '<p class="kw">' + esc(e.keywords) + "</p>" : "") +
      (e.hook ? '<p class="hook">' + esc(e.hook) + "</p>" : "") +
      take +
      '<div class="foot"><span class="case">' + esc(e.case) + '</span><span class="links">' + links.join("") + "</span></div>" +
      "</div></article>";
  }

  function render() {
    var list = document.getElementById("list");
    var shown = eps.filter(match);
    if (!shown.length) { list.innerHTML = '<p class="none">沒有符合的集數。換個關鍵字，或點「全部」。</p>'; return; }
    var groups = {}, order = [];
    shown.forEach(function (e) { var k = e.date.slice(0, 7); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(e); });
    list.innerHTML = order.map(function (k) {
      var p = k.split("-");
      return '<section class="month"><h2><strong>' + (+p[1]) + " 月</strong>" + p[0] + "・" + groups[k].length + " 集</h2>" +
        groups[k].map(item).join("") + "</section>";
    }).join("");
  }
  render();
})();
</script>
